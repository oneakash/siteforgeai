[project]
name = "app"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.163.1",
    "langchain-core>=1.0",
    "langchain-google-genai==4.5.0",
    "langchain-groq==1.2.0",
    "langchain-openai==1.8.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-postgres==3.2.1",
    "pgvector==0.5.1",
    "psycopg[binary,pool]==3.3.9",
    "pydantic>=2.8",
    "sqlalchemy==2.1.8",
    "uvicorn[standard]>=0.30",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by black)
    "B008", # Do not perform function calls in argument defaults (common in FastAPI Depends)
    "UP038", # isinstance with tuple is fine in Python 3.12
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
follow_imports = "skip"
ignore_missing_imports = true

# Silence known false positives from LangChain (SecretStr) and LangGraph (dynamic state/DB rows)
disable_error_code = [
    "index",          # tuple[Any, ...] | None indexing (common in psycopg fetchone)
    "attr-defined",   # BaseModel dynamic attributes (LangGraph state narrowing)
    "assignment",     # LangChain embedder type swapping
    "union-attr",     # accessing .content on StoredArtifact | None
    "arg-type",       # LangChain api_key string vs SecretStr
    "call-arg",       # LangChain dynamic kwargs
    "no-any-return",  # Common in dict/DB row access
    "literal-required" # LangGraph state dict keys
]

exclude = ["tests/"]

[dependency-groups]
dev = [
    "black==24.2.0",
    "httpx>=0.27",
    "isort==5.13.2",
    "mypy==1.9.0",
    "pre-commit==3.6.2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff==0.3.0",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E702", # Allow semicolons in tests for compact setup
    "B017", # Allow pytest.raises(Exception) for generic failure testing
]
