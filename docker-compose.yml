services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siteforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siteforge}
      POSTGRES_DB: ${POSTGRES_DB:-siteforge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siteforge} -d ${POSTGRES_DB:-siteforge}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-siteforge}:${POSTGRES_PASSWORD:-siteforge}@db:5432/${POSTGRES_DB:-siteforge}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  renderer:
    build: ./renderer
    ports:
      - "4000:4000"
    volumes:
      - ./renderer:/app
      - /app/node_modules

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  arq_worker:
    build: ./backend
    command: uv run arq app.worker.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-siteforge}:${POSTGRES_PASSWORD:-siteforge}@db:5432/${POSTGRES_DB:-siteforge}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
  redis_data:
